name: Refresh 26056 live fares

on:
  schedule:
    # Every 6 hours. Cleartrip fares move a few times a day; this keeps the
    # "scraped at" timestamps on the live site genuinely recent without
    # anyone having to remember to re-run the scraper by hand.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper dependencies
        working-directory: 26056/scraper
        run: npm ci

      - name: Run Cleartrip scraper
        working-directory: 26056/scraper
        run: npm run scrape:cleartrip
        env:
          CI: true

      - name: Commit refreshed fares
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 26056/frontend/src/data/liveFareLadder.json 26056/frontend/src/data/liveCabinCompare.json
          git diff --cached --quiet && echo "No fare changes, skipping commit" && exit 0
          git commit -m "Refresh live IDR-BLR fares [automated]"
          git push

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="VIMAAN publishes APIx, a daily route-specific airfare price index for India, built to augment the CPI Transport and Communication sub-group."
    />
    <title>VIMAAN · APIx Airfare Price Index</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      try {
        var stored = localStorage.getItem('vimaan.theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

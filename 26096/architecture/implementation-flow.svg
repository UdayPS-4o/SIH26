<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <style>
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .16em; fill: #A8A29E; }
    .title   { font-size: 27px; font-weight: 700; fill: #1C1917; }
    .sub     { font-size: 14.5px; fill: #78716C; }
    .h       { font-size: 14px; font-weight: 700; fill: #1C1917; }
    .h2      { font-size: 12.5px; font-weight: 700; fill: #1C1917; }
    .b       { font-size: 12px; fill: #57534E; }
    .bs      { font-size: 11px; fill: #78716C; }
    .num     { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .lane    { font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    .dev     { font-size: 11.5px; fill: #57534E; }
  </style>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- ── header ─────────────────────────────────────────────── -->
  <text x="48" y="40" class="eyebrow">IMPLEMENTATION FLOW · PS 26096 · SAMDARSHI</text>
  <text x="48" y="72" class="title">The archive grows on the left. The kiosk only speaks from it.</text>
  <text x="48" y="98" class="sub">Digitisation feeds one verified core. Every visitor answer is retrieved, reranked and cited — or honestly refused.</text>

  <rect x="1268" y="44" width="284" height="46" rx="23" fill="#EEF2FF" stroke="#C7D2FE"/>
  <circle cx="1294" cy="67" r="5" fill="#1E3A8A"/>
  <text x="1310" y="63" class="h2" fill="#1E3A8A">No cloud. No hallucinations.</text>
  <text x="1310" y="79" class="bs" fill="#4F46E5">every sentence carries a page citation</text>

  <line x1="48" y1="122" x2="1552" y2="122" stroke="#E7E5E4" stroke-width="1"/>

  <!-- ── LEFT LANE : digitisation ────────────────────────────── -->
  <text x="48" y="148" class="lane" fill="#C2410C">DIGITISE — HOW THE ARCHIVE GROWS</text>

  <rect x="48" y="160" width="380" height="92" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
  <circle cx="72" cy="186" r="11" fill="#C2410C"/><text x="72" y="190" class="num" text-anchor="middle">1</text>
  <text x="92" y="191" class="h">Capture</text>
  <text x="70" y="216" class="b">flatbed scan or document camera, 600 dpi</text>
  <text x="70" y="236" class="bs">manuscripts, letters, judgments, photographs</text>

  <path d="M232 256 l6 12 6 -12 z" fill="#D6D3D1"/>

  <rect x="48" y="266" width="380" height="92" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
  <circle cx="72" cy="292" r="11" fill="#C2410C"/><text x="72" y="296" class="num" text-anchor="middle">2</text>
  <text x="92" y="297" class="h">Restore</text>
  <text x="70" y="322" class="b">deskew · denoise · binarise · contrast lift</text>
  <text x="70" y="342" class="bs">seventy-year-old paper is the hard part, not the model</text>

  <path d="M232 362 l6 12 6 -12 z" fill="#D6D3D1"/>

  <rect x="48" y="372" width="380" height="92" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
  <circle cx="72" cy="398" r="11" fill="#C2410C"/><text x="72" y="402" class="num" text-anchor="middle">3</text>
  <text x="92" y="403" class="h">Read</text>
  <text x="70" y="428" class="b">Tesseract 5 + EasyOCR, best result per word</text>
  <text x="70" y="448" class="bs">Devanagari and Sanskrit, not just English</text>

  <path d="M232 468 l6 12 6 -12 z" fill="#D6D3D1"/>

  <rect x="48" y="478" width="380" height="92" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="72" cy="504" r="11" fill="#B45309"/><text x="72" y="508" class="num" text-anchor="middle">4</text>
  <text x="92" y="509" class="h" fill="#B45309">Curator verifies</text>
  <text x="70" y="534" class="b">corrects OCR, tags date, source, language</text>
  <text x="70" y="554" class="bs">nothing enters the archive unverified</text>

  <path d="M232 574 l6 12 6 -12 z" fill="#D6D3D1"/>

  <rect x="48" y="584" width="380" height="92" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
  <circle cx="72" cy="610" r="11" fill="#C2410C"/><text x="72" y="614" class="num" text-anchor="middle">5</text>
  <text x="92" y="615" class="h">Index</text>
  <text x="70" y="640" class="b">512-token chunks · embeddings · keyword index</text>
  <text x="70" y="660" class="bs">each chunk keeps a link back to its scanned page</text>

  <text x="48" y="706" class="bs">A scanned page is useless until it is searchable. This lane is the difference</text>
  <text x="48" y="724" class="bs">between a digital photo album and an archive.</text>

  <!-- left lane -> core -->
  <path d="M432 418 h34" stroke="#A8A29E" stroke-width="1.5" fill="none"/>
  <path d="M466 412 l12 6 -12 6 z" fill="#A8A29E"/>

  <!-- ── CENTRE : the verified core ──────────────────────────── -->
  <rect x="480" y="160" width="600" height="290" rx="14" fill="#FDF8EF" stroke="#EADFC8" stroke-width="1.5"/>
  <text x="506" y="192" class="h" font-size="16">The verified archive</text>
  <text x="506" y="214" class="b">the single source of truth — if it is not in here, the kiosk will not say it</text>

  <rect x="506" y="232" width="264" height="86" rx="10" fill="#FFFFFF" stroke="#EADFC8"/>
  <text x="524" y="258" class="h2">Page images</text>
  <text x="524" y="278" class="bs">MinIO object store — the original</text>
  <text x="524" y="294" class="bs">scan is always one click away</text>

  <rect x="790" y="232" width="264" height="86" rx="10" fill="#FFFFFF" stroke="#EADFC8"/>
  <text x="808" y="258" class="h2">Text + metadata</text>
  <text x="808" y="278" class="bs">PostgreSQL — source, date,</text>
  <text x="808" y="294" class="bs">language, curator, page number</text>

  <rect x="506" y="330" width="264" height="86" rx="10" fill="#FFFFFF" stroke="#EADFC8"/>
  <text x="524" y="356" class="h2">Embeddings</text>
  <text x="524" y="376" class="bs">pgvector — meaning-level search</text>
  <text x="524" y="392" class="bs">across four languages</text>

  <rect x="790" y="330" width="264" height="86" rx="10" fill="#FFFFFF" stroke="#EADFC8"/>
  <text x="808" y="356" class="h2">Keyword index</text>
  <text x="808" y="376" class="bs">Meilisearch — exact names,</text>
  <text x="808" y="392" class="bs">dates and article numbers</text>

  <!-- core -> ask lane -->
  <path d="M1084 291 h22" stroke="#A8A29E" stroke-width="1.5" fill="none"/>
  <path d="M1106 285 l12 6 -12 6 z" fill="#A8A29E"/>

  <!-- feedback: unanswered questions become backlog -->
  <path d="M1112 566 H452 V524 H442" stroke="#B45309" stroke-width="1.4" fill="none" stroke-dasharray="5 5" opacity=".85"/>
  <path d="M434 518 l-8 6 8 6 z" fill="#B45309" opacity=".85"/>
  <rect x="612" y="544" width="700" height="18" fill="#FFFFFF"/>
  <text x="620" y="558" class="bs" fill="#B45309">every unanswered question becomes a digitisation request — the archive learns what visitors want</text>

  <!-- ── kiosk mock ──────────────────────────────────────────── -->
  <rect x="520" y="596" width="520" height="244" rx="16" fill="#1C1917"/>
  <rect x="538" y="614" width="484" height="208" rx="8" fill="#FDFCF9"/>

  <g>
    <rect x="556" y="628" width="34" height="18" rx="9" fill="#1E3A8A"/>
    <text x="573" y="641" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">EN</text>
    <rect x="596" y="628" width="44" height="18" rx="9" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="618" y="641" font-size="10" fill="#1E3A8A" text-anchor="middle" font-family="'Nirmala UI','Noto Sans Devanagari',sans-serif">हिन्दी</text>
    <rect x="646" y="628" width="52" height="18" rx="9" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="672" y="641" font-size="10" fill="#1E3A8A" text-anchor="middle" font-family="'Nirmala UI','Noto Sans Devanagari',sans-serif">मराठी</text>
    <rect x="704" y="628" width="66" height="18" rx="9" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="737" y="641" font-size="10" fill="#1E3A8A" text-anchor="middle" font-family="'Nirmala UI','Noto Sans Devanagari',sans-serif">संस्कृतम्</text>
  </g>

  <text x="556" y="676" font-size="13.5" font-style="italic" fill="#1C1917">“What did Ambedkar say about caste in the Constitution?”</text>
  <text x="556" y="702" class="dev">Caste, he argued, could not be dissolved by law alone — the Constitution</text>
  <text x="556" y="720" class="dev">could open the door, but social conscience had to walk through it.</text>

  <rect x="556" y="734" width="212" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="570" y="750" font-size="10.5" fill="#065F46">Annihilation of Caste, p. 45</text>
  <rect x="776" y="734" width="228" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="790" y="750" font-size="10.5" fill="#065F46">Constituent Assembly, 25 Nov 1949</text>

  <line x1="556" y1="774" x2="1004" y2="774" stroke="#E7E5E4"/>
  <text x="556" y="798" font-size="11" fill="#1E3A8A">▶  Listen in Hindi</text>
  <text x="676" y="798" font-size="11" fill="#1E3A8A">⌕  Open the original scan</text>
  <text x="1004" y="798" font-size="11" fill="#A8A29E" text-anchor="end">answered on-device in 2.4 s</text>

  <!-- ── RIGHT LANE : the question ───────────────────────────── -->
  <text x="1112" y="148" class="lane" fill="#1E3A8A">ASK — HOW ONE QUESTION IS ANSWERED</text>

  <rect x="1112" y="160" width="440" height="78" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <circle cx="1136" cy="186" r="11" fill="#1E3A8A"/><text x="1136" y="190" class="num" text-anchor="middle">1</text>
  <text x="1156" y="191" class="h">Visitor speaks or touches</text>
  <text x="1134" y="216" class="b">Whisper.cpp transcribes · script and language detected</text>

  <path d="M1326 242 l6 12 6 -12 z" fill="#D6D3D1"/>

  <rect x="1112" y="252" width="440" height="78" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <circle cx="1136" cy="278" r="11" fill="#1E3A8A"/><text x="1136" y="282" class="num" text-anchor="middle">2</text>
  <text x="1156" y="283" class="h">Retrieve from the core</text>
  <text x="1134" y="308" class="b">pgvector + Meilisearch, fused by RRF → top 10 passages</text>

  <path d="M1326 334 l6 12 6 -12 z" fill="#D6D3D1"/>

  <rect x="1112" y="344" width="440" height="78" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <circle cx="1136" cy="370" r="11" fill="#1E3A8A"/><text x="1136" y="374" class="num" text-anchor="middle">3</text>
  <text x="1156" y="375" class="h">Re-rank and filter</text>
  <text x="1134" y="400" class="b">cross-encoder → top 5, everything under 0.7 relevance dropped</text>

  <path d="M1326 426 l6 12 6 -12 z" fill="#D6D3D1"/>

  <!-- the gate : the hero element -->
  <rect x="1112" y="436" width="440" height="176" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/>
  <circle cx="1136" cy="462" r="11" fill="#B45309"/><text x="1136" y="466" class="num" text-anchor="middle">4</text>
  <text x="1156" y="467" class="h" fill="#B45309">Is there evidence for this?</text>

  <rect x="1134" y="482" width="396" height="52" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1150" y="504" font-size="12.5" font-weight="700" fill="#15803D">✓  Yes — Llama 3 answers using only those passages</text>
  <text x="1150" y="523" class="bs" fill="#166534">temperature 0.3, citation per claim, streamed word by word</text>

  <rect x="1134" y="542" width="396" height="52" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="1150" y="564" font-size="12.5" font-weight="700" fill="#B91C1C">✗  No — “that is not in the archive yet”</text>
  <text x="1150" y="583" class="bs" fill="#991B1B">routed to the curator queue instead of being invented</text>

  <path d="M1326 616 l6 12 6 -12 z" fill="#D6D3D1"/>

  <rect x="1112" y="626" width="440" height="78" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <circle cx="1136" cy="652" r="11" fill="#1E3A8A"/><text x="1136" y="656" class="num" text-anchor="middle">5</text>
  <text x="1156" y="657" class="h">Speak it back</text>
  <text x="1134" y="682" class="b">Coqui + Indic TTS narrates in the visitor's own language</text>

  <text x="1112" y="736" class="bs">A chatbot that guesses is a liability in a national memorial.</text>
  <text x="1112" y="754" class="bs">Refusing well is the feature judges remember.</text>

  <!-- ── footer ─────────────────────────────────────────────── -->
  <line x1="48" y1="856" x2="1552" y2="856" stroke="#E7E5E4"/>
  <text x="48" y="880" class="bs">Whisper.cpp · Tesseract 5 + EasyOCR · all-MiniLM · pgvector · Meilisearch · Llama 3 8B via Ollama · Coqui + Indic TTS</text>
  <text x="1552" y="880" class="bs" text-anchor="end">Raspberry Pi 5 kiosk + on-premises AI server · no internet required</text>
</svg>

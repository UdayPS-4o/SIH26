version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samdarshi-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./datasets:/app/datasets:ro
      - samdarshi_db:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./samdarshi.db}
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
      - USE_REAL_AI=${USE_REAL_AI:-false}
      - ENVIRONMENT=production
    networks:
      - samdarshi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samdarshi-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - REACT_APP_API_URL=/api
      - NODE_ENV=production
    networks:
      - samdarshi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: samdarshi-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - samdarshi-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  samdarshi-net:
    driver: bridge
    name: samdarshi-prototype-net

volumes:
  samdarshi_db:
    driver: local
    name: samdarshi-db-data

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./datasets:/app/datasets:ro
      - samdarshi_db:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./samdarshi.db}
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
      - USE_REAL_AI=${USE_REAL_AI:-false}
      - ENVIRONMENT=production
    networks:
      - samdarshi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
    environment:
      - REACT_APP_API_URL=/api
      - NODE_ENV=production
    networks:
      - samdarshi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - samdarshi-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  samdarshi-net:
    driver: bridge

volumes:
  samdarshi_db:
    driver: local

  <!-- hotspot heat over Shed C -->
  <g>
    <circle cx="365" cy="234" r="70" fill="#ef4444" opacity="0.12"/>
    <circle cx="365" cy="234" r="46" fill="#ef4444" opacity="0.16"/>
    <circle cx="365" cy="234" r="24" fill="#ef4444" opacity="0.22"/>
  </g>
  <!-- trees -->
  <g fill="#6fae57">
    <circle cx="34" cy="150" r="7"/><circle cx="52" cy="156" r="6"/>
    <circle cx="486" cy="150" r="7"/><circle cx="470" cy="158" r="6"/>
    <circle cx="250" cy="300" r="7"/><circle cx="270" cy="306" r="6"/>
    <circle cx="200" cy="40" r="6"/>

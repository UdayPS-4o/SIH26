version: "3.9"

services:
  watchtower:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: watchtower-enclave
    restart: unless-stopped

    # ── EGRESS ENFORCEMENT ──────────────────────────────────────────────
    # read-only root filesystem (only /tmp and /run writable)
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=512m
      - /run:size=64m

    # Drop ALL capabilities — none needed for passive monitoring
    cap_drop:
      - ALL

    # No new privileges escalation allowed
    security_opt:
      - no-new-privileges:true
      - seccomp:/etc/watchtower-seccomp.json

    # ── DEMO MODE: bridge + port publish for dashboard access ───────────
    # For TRUE air-gapped deployment, use: network_mode: none
    # and access the dashboard via a separate out-of-band channel
    # (e.g., HDMI to a disconnected monitor, or serial console)
    ports:
      - "127.0.0.1:8000:8000"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 2G

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Environment
    environment:
      - WATCHTOWER_ENV=demo
      - WATCHTOWER_LOG_LEVEL=INFO
      - WATCHTOWER_MAX_FLOWS=1000000
      - WATCHTOWER_CAPTURE_MODE=pcap_replay

    # Mount attack traffic PCAPs (read-only)
    volumes:
      - ../data/pcaps:/data/pcaps:ro
      - ../data/models:/data/models:ro
      - ../data/output:/data/output:rw
      - ./seccomp-profile.json:/etc/watchtower-seccomp.json:ro

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

    # For production air-gapped deployment, replace the ports section with:
    #
    # network_mode: none
    #
    # and remove the healthcheck (no HTTP access).
    # Dashboard is accessed via:
    #   - USB video output to isolated monitor
    #   - Serial console (RS-232) to ops terminal
    #   - One-time USB transfer of alert ledger (WORM stick)
